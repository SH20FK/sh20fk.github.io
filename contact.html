    <main id="main-content" class="container">
        <section class="module module-form" aria-labelledby="form-heading">
            <div class="form-wrapper glass-card liquid-glass" data-aos>
                <div class="form-header">
                    <span class="form-icon">&#9993;</span>
                    <h2 id="form-heading" data-i18n="form_heading">Send Message</h2>
                </div>
                <form id="contact-form" class="contact-form" novalidate method="POST" action="https://formspree.io/f/xpqaweew">
                    <div class="form-row">
                        <div class="form-group">
                            <input type="text" id="name" name="name" placeholder=" " required aria-required="true" aria-describedby="name-error" autocomplete="name">
                            <label for="name"><span data-i18n="form_name">Name</span> *</label>
                            <span class="error-message" id="name-error" role="alert"></span>
                        </div>
                        <div class="form-group">
                            <input type="email" id="email" name="email" placeholder=" " required aria-required="true" aria-describedby="email-error" autocomplete="email">
                            <label for="email"><span data-i18n="form_email">Email</span> *</label>
                            <span class="error-message" id="email-error" role="alert"></span>
                        </div>
                    </div>
                    <div class="form-group">
                        <input type="text" id="subject" name="subject" placeholder=" " required aria-required="true" aria-describedby="subject-error">
                        <label for="subject"><span data-i18n="form_subject">Subject</span> *</label>
                        <span class="error-message" id="subject-error" role="alert"></span>
                    </div>
                    <div class="form-group">
                        <textarea id="message" name="message" rows="4" placeholder=" " required aria-required="true" aria-describedby="message-error"></textarea>
                        <label for="message"><span data-i18n="form_message">Message</span> *</label>
                        <span class="error-message" id="message-error" role="alert"></span>
                    </div>
                    <button type="submit" class="submit-btn glass-mini" aria-label="Send message">
                        <span data-i18n="form_send">Send</span>
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                            <line x1="22" y1="2" x2="11" y2="13"/>
                            <polygon points="22 2 15 22 11 13 2 9 22 2"/>
                        </svg>
                    </button>
                    <div class="form-status" id="form-status" role="status" aria-live="polite"></div>
                </form>
            </div>
        </section>
    </main>
